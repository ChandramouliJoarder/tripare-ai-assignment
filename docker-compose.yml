version: "3.8"

services:
  postgresql:
    image: postgres:15-alpine
    container_name: hotel-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hotel-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hotel-network
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: hotel-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal-config:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - hotel-network
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: hotel-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - hotel-network
    restart: unless-stopped

  api:
    build:
      context: .
      target: production
    container_name: hotel-api
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TASK_QUEUE=hotel-offers
      - SUPPLIER_BASE_URL=http://api:3000
      - SUPPLIER_A_DOWN=false
      - SUPPLIER_B_DOWN=false
      - CACHE_TTL_SECONDS=300
      - LOG_LEVEL=info
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - hotel-network
    restart: unless-stopped

  worker:
    build:
      context: .
      target: production
    container_name: hotel-worker
    command: ["node", "dist/temporal/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TASK_QUEUE=hotel-offers
      - SUPPLIER_BASE_URL=http://api:3000
      - LOG_LEVEL=info
      - NODE_ENV=production
    networks:
      - hotel-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  hotel-network:
    driver: bridge
